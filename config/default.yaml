project:
  name: traffic-plate-study

vehicle:
  model: yolo26s.pt
  tracker_file: bytetrack_study.yaml
  image_size: 960
  confidence: 0.25
  iou: 0.60
  device: null
  class_ids: [2, 3, 5, 7]
  minimum_track_frames: 5
  crop_expansion: 0.05
  min_crop_width: 120
  min_crop_height: 80
  min_crop_blur_score: 10.0

plate:
  detector_model: yolo-v9-s-608-license-plate-end2end
  detector_confidence: 0.35
  ocr_model: cct-s-v2-global-model
  ocr_device: auto
  every_n_frames: 2
  max_attempts_per_track: 30
  max_observations_per_track: 12
  min_text_length: 5
  max_text_length: 12
  text_pattern: "^[A-Z0-9]{5,12}$"

consensus:
  minimum_support: 3
  minimum_confidence: 0.80
  maximum_normalized_edit_distance: 0.20

roi:
  polygon: []

output:
  save_best_crops: true
  include_all_plate_observations: true
  json_indent: 2
  video_codec: mp4v
