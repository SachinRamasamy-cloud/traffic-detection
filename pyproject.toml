[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-plate-study"
version = "0.1.0"
description = "Offline vehicle tracking and number-plate recognition study pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Traffic Plate Study"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "PyYAML>=6.0",
  "ultralytics",
  "fast-alpr[onnx]==0.4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
traffic-plate-study = "traffic_plate_study.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
