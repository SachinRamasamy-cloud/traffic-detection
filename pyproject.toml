[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26-midrange-roi-tracker"
version = "0.1.0"
description = "YOLO26m + ROI-aware tiling + ByteTrack tracking for Linux CPU study workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7",
  "ultralytics>=8.4.55,<8.5",
]

[project.scripts]
traffic-track = "traffic_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
